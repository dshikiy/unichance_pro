<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniChance | Профиль</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gradient">
    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="static/unichance-logo.svg" alt="UniChance Logo" class="logo-img">
            </a>
            <nav class="nav-links">
                <a href="/" class="nav-link">Басты бет</a>
                <a href="/input.html" class="nav-link">Подбор</a>
                <a href="/results.html" class="nav-link">Нәтижелер</a>
                <a href="/profile.html" class="nav-link active">Профиль</a>
                
                <div id="google_translate_element" style="display: none;"></div>
                
                <div class="custom-lang-selector">
                    <button class="lang-btn" onclick="changeLanguage('kk')">KZ</button>
                    <button class="lang-btn" onclick="changeLanguage('ru')">RU</button>
                    <button class="lang-btn" onclick="changeLanguage('en')">EN</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="container py-5">
        <div class="glass-card" style="max-width: 800px; margin: 0 auto; text-align: center;">
            <div style="font-size: 4rem; margin-bottom: 20px;">👤</div>
            <h2 style="margin-bottom: 20px;">Менің профилім</h2>
            
            <div style="display: flex; justify-content: center; gap: 30px; margin-bottom: 30px;">
                <div style="background: rgba(0,0,0,0.2); padding: 15px 30px; border-radius: 12px;">
                    <p style="color: #aaa; font-size: 0.9rem;">Менің IELTS балым</p>
                    <h3 id="profileIelts" style="font-size: 1.5rem; color: var(--primary);">0</h3>
                </div>
                <div style="background: rgba(0,0,0,0.2); padding: 15px 30px; border-radius: 12px;">
                    <p style="color: #aaa; font-size: 0.9rem;">Менің GPA балым</p>
                    <h3 id="profileGpa" style="font-size: 1.5rem; color: var(--primary);">0</h3>
                </div>
            </div>

            <a href="/input.html" class="btn-primary">Мәліметтерді жаңарту</a>
        </div>
    </main>

    <script src="/static/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userData = JSON.parse(localStorage.getItem('userData'));
            if (userData) {
                document.getElementById('profileIelts').textContent = userData.ielts || '0';
                document.getElementById('profileGpa').textContent = userData.gpa || '0';
            }
        });
    </script>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'kk', 
            includedLanguages: 'kk,ru,en',
            autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        function changeLanguage(langCode) {
            if (langCode === 'kk') {
                // Полностью убиваем куки Google Translate для казахского языка (возвращаем оригинал)
                document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
                document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=" + window.location.hostname;
                document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=." + window.location.hostname;
            } else {
                // Включаем Google переводчик только для RU и EN
                document.cookie = "googtrans=/kk/" + langCode + "; path=/;";
                document.cookie = "googtrans=/kk/" + langCode + "; path=/; domain=." + window.location.hostname;
            }
            window.location.reload();
        }
    </script>
</body>
</html>
