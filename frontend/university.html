<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniChance | Университет туралы</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gradient">
    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="static/logo.svg" alt="UniChance Logo" class="logo-img">
            </a>
            <nav class="nav-links">
                <a href="/" class="nav-link">Басты бет</a>
                <a href="/input.html" class="nav-link">Подбор</a>
                <a href="/results.html" class="nav-link">Нәтижелер</a>
                <a href="/profile.html" class="nav-link">Профиль</a>
                
                <div id="google_translate_element" style="display: none;"></div>
                
                <div class="custom-lang-selector">
                    <button class="lang-btn" onclick="changeLanguage('kk')">KZ</button>
                    <button class="lang-btn" onclick="changeLanguage('ru')">RU</button>
                    <button class="lang-btn" onclick="changeLanguage('en')">EN</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="container py-5" id="universityDetails">
        <div class="glass-card" style="padding: 40px;">
            <h1 id="uniName">Жүктелуде...</h1>
            <p id="uniLocation" style="color: #ddd; font-size: 1.1rem;">📍 ...</p>
            <p id="uniDescription" style="margin-top: 20px; line-height: 1.6;">...</p>
            <a id="uniWebsite" href="#" target="_blank" class="btn-primary" style="margin-top: 20px; display: inline-block;">Ресми сайтқа өту</a>
        </div>
    </main>
    
    <script src="/static/app.js"></script>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'kk', 
            includedLanguages: 'kk,ru,en',
            autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        function changeLanguage(langCode) {
            if (langCode === 'kk') {
                // Полностью убиваем куки Google Translate для казахского языка (возвращаем оригинал)
                document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
                document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=" + window.location.hostname;
                document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=." + window.location.hostname;
            } else {
                // Включаем Google переводчик только для RU и EN
                document.cookie = "googtrans=/kk/" + langCode + "; path=/;";
                document.cookie = "googtrans=/kk/" + langCode + "; path=/; domain=." + window.location.hostname;
            }
            window.location.reload();
        }
    </script>
</body>
</html>
