<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniChance | Подбор</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="bg-gradient">

    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="static/unichance-logo.svg" alt="UniChance Logo" class="logo-img">
            </a>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">Басты бет</a>
                <a href="input.html" class="nav-link active">Подбор</a>
                <a href="results.html" class="nav-link">Нәтижелер</a>
                <a href="profile.html" class="nav-link">Профиль</a>
                
                <div id="google_translate_element" style="display: none;"></div>
                
                <div class="custom-lang-selector">
                    <button class="lang-btn" onclick="changeLanguage('kk')">KZ</button>
                    <button class="lang-btn" onclick="changeLanguage('ru')">RU</button>
                    <button class="lang-btn" onclick="changeLanguage('en')">EN</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="container py-5">
        <div class="glass-card form-card">
            <h2 style="text-align: center; margin-bottom: 10px;">Көрсеткіштеріңізді енгізіңіз</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px;">AI алгоритмі сізге ең қолайлы университеттерді таңдайды</p>

            <form id="inputForm">
                <div class="input-group">
                    <label>IELTS Score (0-9)</label>
                    <input type="number" id="ielts" step="0.5" min="0" max="9" placeholder="Мысалы: 6.5" required>
                </div>

                <div class="input-group">
                    <label>GPA (0-4.0)</label>
                    <input type="number" id="gpa" step="0.01" min="0" max="4" placeholder="Мысалы: 3.8" required>
                </div>

                <div class="input-group">
                    <label>SAT Score (Опционалды)</label>
                    <input type="number" id="sat" min="400" max="1600" placeholder="Мысалы: 1250">
                </div>

                <div class="input-group">
                    <label>Мамандық</label>
                    <select id="major" required>
                        <option value="" disabled selected>Жүктелуде...</option>
                    </select>
                </div>

                <div class="checkbox-group" style="margin-top: 20px;">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="grant">
                        <span style="margin-left: 10px; color: white;">Тек 100% гранттарды көрсету</span>
                    </label>
                </div>

                <button type="submit" class="btn-primary w-100 mt-4">
                    Нәтижені көру
                </button>
            </form>
        </div>
    </main>

    <script src="static/app.js"></script>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'kk', 
            includedLanguages: 'kk,ru,en',
            autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        function changeLanguage(langCode) {
            if (langCode === 'kk') {
                // Полностью убиваем куки Google Translate для казахского языка (возвращаем оригинал)
                document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
                document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=" + window.location.hostname;
                document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=." + window.location.hostname;
            } else {
                // Включаем Google переводчик только для RU и EN
                document.cookie = "googtrans=/kk/" + langCode + "; path=/;";
                document.cookie = "googtrans=/kk/" + langCode + "; path=/; domain=." + window.location.hostname;
            }
            window.location.reload();
        }
    </script>
</body>
</html>
